name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v5.0.0)'
        required: true
        type: string

# contents: read checks out the tagged commit. id-token: write is what npm
# provenance asks Sigstore for. This job does not push, tag, or open a release.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Same Bun pin as .github/workflows/typescript.yml. Bun installs; Node
      # 22.16 is the engines floor (FTS5 in node:sqlite) and drives npm publish.
      # Every action is pinned to a commit: a tag can be moved, a commit cannot.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16
          registry-url: https://registry.npmjs.org
      - name: Restore Bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Resolve publish tag name
        id: publish_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      # Refuses when the tag (leading v removed) is not package.json's version.
      # workflow_dispatch must pass the real release tag (e.g. v5.0.0 on master).
      - name: Refuse a tag whose version is not package.json's version
        run: node scripts/publish-version-guard.mjs "${{ steps.publish_tag.outputs.name }}"
      # The one build + test gate is prepublishOnly (clean, build, test:ci).
      # npm publish runs it automatically; do not duplicate the suite here.
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Repository secret NPM is missing or empty. Add an npm automation token named NPM before publishing."
            exit 1
          fi
          npm publish --provenance --access public
