name: TypeScript

on:
  push:
    branches: [master, main]
  pull_request:
  # An auto-merged Dependabot PR is pushed with GITHUB_TOKEN, and GitHub's recursion guard
  # suppresses workflow triggers for those pushes -- so the default branch can carry a
  # dependency commit with NO run at all. Measured 2026-08-28 across this repo's history.
  # The PR gate still holds (branch protection requires the checks), so what is lost is
  # post-merge telemetry, not the gate. A nightly run re-exercises the branch regardless of
  # who pushed it; workflow_dispatch allows a gap to be backfilled on the spot.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The matrix values appear in the job name, so these strings ARE the branch
    # protection contexts. Changing the matrix renames the required checks and
    # silently blocks every PR until protection is updated to match.
    #
    # The Node 22 leg is pinned to 22.16, not the `22` alias: that is the lowest
    # release whose node:sqlite includes FTS5 (nodejs/node#57621), and the SQLite
    # backend needs FTS5 to create its index. `22` would pass today and stop
    # guarding the floor. This renamed the three `ci (*, 22)` contexts to
    # `ci (*, 22.16)`.
    name: ci (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are not decoration: filesystem atomicity, path
        # separators, worker spawn and SQLite file locking all differ there, and
        # a single-OS run cannot see those failures. The package itself ships no
        # native code since Sprint 9 (the SQLite backend is node:sqlite).
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.16, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22.16
        run: bun audit --audit-level=high

      # Tool packages have independent lockfiles and are not covered by the
      # root audit. Audit each one without installing it into the root tree.
      # Audit once, on one leg. Running it on all six duplicates the same network
      # work and turns a registry hiccup into six red jobs instead of one.
      - name: Audit tool dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22.16
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            tool_dir="$(dirname "$lockfile")"
            echo "Auditing $tool_dir"
            npm audit --audit-level=high --package-lock-only --prefix "$tool_dir"
          done < <(find tools -mindepth 2 -maxdepth 2 -name package-lock.json -print0)

      # The graph generator needs its own locked dependencies (js-yaml). Without them it
      # cannot start, which is why the duplicate gate used to read a committed report
      # (--no-regen) that could be arbitrarily stale.
      - name: Install graph tool dependencies
        run: npm ci --prefix tools/create-dependency-graph --ignore-scripts --no-audit --no-fund

      # Source-backed census, step 1 of 2. MUST run before any regeneration: it compares the
      # COMMITTED docs/architecture/file-inventory.json with a fresh walk of the repository and
      # fails if a file was added or removed after the last regeneration.
      - name: Check file census against the source tree
        run: bun run tools:check-census

      # Step 2 of 2. Regenerates every report by parsing src (no --no-regen), gates duplicate
      # symbols on that fresh parse, then fails if the regenerated census differs from the
      # committed one. Only the "generated" date line is ignored.
      - name: Check duplicate symbols and census freshness (regenerated from source)
        shell: bash
        run: |
          set -euo pipefail
          bun run tools:check-duplicates
          if ! git diff --ignore-cr-at-eol -I '"generated":' --exit-code -- docs/architecture/file-inventory.json; then
            echo "::error::docs/architecture/file-inventory.json is stale. Run 'bun run tools:deps' and commit docs/architecture."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:ci
        env:
          SKIP_BENCHMARKS: "true"

      # SQLiteStorage runs on node:sqlite (src/core/nodeSqliteAdapter.ts) and that is the only
      # driver since Sprint 9. The step stays because it is the explicit proof that the suite
      # passes with MEMORY_SQLITE_DRIVER=node set, which is the setting deployments and plugins
      # that used the old driver selector still carry. Node 24 loads node:sqlite unflagged.
      - name: Test (node:sqlite driver)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: bun run test:ci
        env:
          SKIP_BENCHMARKS: "true"
          MEMORY_SQLITE_DRIVER: node

      - name: Build
        run: bun run build

      # MUST stay after Build. This step imports ./dist/index.cjs, which does not exist until
      # `bun run build` has produced it -- placed before Build it failed on all six legs with
      # "Cannot find module .../dist/index.cjs", which reads like a packaging defect rather than
      # a step-ordering one. The check itself is right and worth keeping: the package declares
      # main + exports.require -> ./dist/index.cjs, and the rest of CI runs under Bun, so without
      # this nothing ever loads the shipped CJS artifact under Node.
      - name: Node runtime smoke (the shipped artifact must load under Node)
      # A deadline that expires FAILS the step. The script also drives the shipped SQLite backend
      # (write, read, FTS5 search), so a runtime whose SQLite lacks FTS5 fails here.
        run: node scripts/node-runtime-smoke.mjs

  # The two documentation gates of repo-tools. Both read the source, so a table that no longer
  # matches the graph, or an exported symbol without a doc comment, fails here. The `ci` job above
  # checks the census and the duplicate symbols but runs neither gate. The tool version is pinned:
  # change it by hand, in a pull request, after you read the release notes.
  architecture-docs:
    # This name is the branch protection context when the check is made required. Do not rename it.
    name: Architecture docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install repo-tools (pinned)
        run: npm install --global --ignore-scripts --no-audit --no-fund @danielsimonjr/repo-tools@2.3.0

      - name: Architecture documents match the source graph
        run: repo-tools check . --docs=docs/architecture

      - name: Exported symbols have doc comments
        run: repo-tools docs check src
