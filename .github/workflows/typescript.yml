name: TypeScript

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Tool packages have independent lockfiles and are not covered by the
      # root audit. Audit each one without installing it into the root tree.
      - name: Audit tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            tool_dir="$(dirname "$lockfile")"
            echo "Auditing $tool_dir"
            npm audit --audit-level=high --package-lock-only --prefix "$tool_dir"
          done < <(find tools -mindepth 2 -maxdepth 2 -name package-lock.json -print0)

      - name: Check duplicate symbols
        run: bun run tools:check-duplicates -- --no-regen

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:ci
        env:
          SKIP_BENCHMARKS: "true"

      - name: Build
        run: bun run build
