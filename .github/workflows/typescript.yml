name: TypeScript

on:
  push:
    branches: [master, main]
  pull_request:
  release:
    types: [published]

jobs:
  ci:
    name: CI (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is tracked, so `npm ci` pins the build to the
      # reviewed lockfile. better-sqlite3 is a native dep but ships ubuntu
      # prebuilds, so install resolves without a local toolchain.
      - name: Install dependencies
        run: npm ci

      # Supply-chain gate: fail on known high/critical advisories in the
      # resolved dependency tree.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Duplicate-symbol gate. --no-regen checks against the committed
      # docs/architecture/duplicate-symbols.json instead of regenerating it
      # (regeneration mutates that artifact and is slow).
      - name: Check duplicate symbols
        run: npm run tools:check-duplicates -- --no-regen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # SKIP_BENCHMARKS=true gates the perf-benchmark suites (honored per-test);
      # test:ci additionally excludes tests/performance/**.
      - name: Test
        run: npm run test:ci
        env:
          SKIP_BENCHMARKS: "true"

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'release'
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      # Upgrading explicitly keeps this independent of the bundled npm version.
      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Publishes via npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN needed.
      # GitHub mints a short-lived, workflow-scoped credential using the
      # `id-token: write` permission above, so there is no long-lived token to
      # store, rotate, or leak. Provenance attestations are emitted
      # automatically under trusted publishing, so `--provenance` is redundant.
      #
      # REQUIRES a trusted publisher configured on npmjs.com for this package:
      #   Package -> Settings -> Trusted Publisher -> GitHub Actions
      #     organization/user: danielsimonjr
      #     repository:        MemoryJS
      #     workflow filename: typescript.yml
      #     environment:       release
      #
      # prepublishOnly (clean + build + test:ci) runs automatically on publish.
      - name: Publish package
        run: npm publish --access public
        env:
          SKIP_BENCHMARKS: "true"
