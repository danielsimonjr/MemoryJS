version: 2
updates:
  # npm, not bun, DELIBERATELY. This repo uses bun.lock, but Dependabot parses only
  # lockfileVersion 1 and Bun writes 2 -- the three sibling repos that declared the bun
  # ecosystem had every updater run fail with "Unsupported bun.lock lockfileVersion 2".
  #
  # No package-lock.json is committed here, so npm updates package.json ranges only and
  # bun.lock stays authoritative, regenerated by `bun install` rather than by Dependabot.
  # Committing a second lockfile would be a second source of truth to drift.
  #
  # Added 2026-08-28: this repo had NO dependabot.yml at all, so a published package was
  # receiving no dependency updates and no automated security PRs. Alerts were enabled and
  # reporting 0 open, which is exactly the shape of a false all-clear -- nothing was wrong,
  # but nothing was watching either.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, npm]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
